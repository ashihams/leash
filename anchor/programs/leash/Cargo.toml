[package]
name = "leash"
version = "0.1.0"
description = "Bounded spending authority for a Solana agent"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "leash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
solana-instructions-sysvar = "3.0"
solana-sdk-ids = "3.1"
solana-sha256-hasher = "3.1"

[dev-dependencies]
ed25519-dalek = "2"
litesvm = { version = "0.16.0", features = ["precompiles"] }
solana-ed25519-program = "3.0.0"
solana-sdk = "4.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
